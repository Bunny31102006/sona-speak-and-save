name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Initialize Capacitor Android project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install Native Android TTS Bridge & App Icons
        run: |
          mkdir -p android/app/src/main/java/com/sona/speakandsave
          cp android-bridge/MainActivity.java android/app/src/main/java/com/sona/speakandsave/MainActivity.java
          if [ -d "android-icons" ]; then
            cp -r android-icons/* android/app/src/main/res/
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Sona-Speak-and-Save-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
